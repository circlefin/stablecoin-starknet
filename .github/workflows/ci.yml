name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  run_ci_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: "22.17.0"

      - name: Setup CI Environment
        run: |
          make setup

      - name: Source environment and verify tools
        run: |
          # Source the environment setup
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          source $(brew --prefix asdf)/libexec/asdf.sh
          source "$HOME/.cargo/env"

          # Ensure Universal Sierra Compiler is in PATH for this step
          export PATH="$HOME/.local/bin:$PATH"

          # Verify installations
          echo "Checking installed tools:"
          which starknet-devnet || echo "starknet-devnet not found"
          which scarb || echo "scarb not found"
          which asdf || echo "asdf not found"
          which cargo || echo "cargo not found"
          which rustc || echo "rustc not found"
          which universal-sierra-compiler || echo "universal-sierra-compiler not found"
          asdf current || echo "No asdf tools configured"

          # Add asdf and brew paths to GITHUB_PATH for subsequent steps
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          echo "/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH
          echo "$HOME/.asdf/bin" >> $GITHUB_PATH
          echo "$HOME/.asdf/shims" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Verify Rust is in PATH
          echo "Rust version: $(rustc --version)"
          echo "Cargo version: $(cargo --version)"

      - name: Clean Cairo Build Artifacts
        run: scarb clean

      - name: Build Cairo Contracts Artifacts
        run: scarb --release build --workspace

      - name: Run Cairo tests
        run: make test-forge

  release-sbom:
    if: github.event_name == 'push'
    uses: circlefin/circle-public-github-workflows/.github/workflows/attach-release-assets.yaml@v1
