[workspace]
members = ["packages/stablecoin", "packages/components", "packages/mock_contracts"]

[workspace.package]
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.12.0"
scarb-version = "2.12.0"
authors = ["Circle"]
description = "Stablecoin Contracts Starknet"
homepage = "https://www.circle.com"
license-file = "LICENSE"
repository = "https://github.com/circlefin/stablecoin-starknet"
documentation = "https://developers.circle.com/starknet/docs"
keywords = ["starknet", "stablecoin", "contracts"]

[workspace.dependencies]
starknet = "2.12.0"
snforge_std = "0.48.1"
assert_macros = "2.12.0"
stablecoin = { path = "packages/stablecoin" }
mock_contracts = { path = "packages/mock_contracts" }

[workspace.scripts]
test = "snforge test"

[workspace.tool.fmt]
sort-module-level-items = true

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[profile.dev.cairo]
unstable-add-statements-functions-debug-info = true
unstable-add-statements-code-locations-debug-info = true
inlining-strategy = "avoid"
